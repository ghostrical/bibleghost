<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Board Insert Page</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">boardinsert.html 확인</h1>

    <!-- 입력 폼 -->
    <div class="mb-3">
        <label for="boardPk" class="form-label">Board PK</label>
        <input type="text" class="form-control" id="boardPk">
    </div>
    <div class="mb-3">
        <label for="title" class="form-label">제목</label>
        <input type="text" class="form-control" id="title">
    </div>
    <div class="mb-3">
        <label for="writer" class="form-label">작성자</label>
        <input type="text" class="form-control" id="writer">
    </div>
    <div class="mb-3">
        <label for="source" class="form-label">Source</label>
        <input type="text" class="form-control" id="source">
    </div>

    <!-- 입력 버튼 -->
    <button class="btn btn-primary" id="submitBtn">입력</button>

    <!-- main 버튼 -->
    <div class="mt-4">
        <button class="btn btn-secondary" onclick="window.location.href='http://localhost:8080/content'">Main</button>
    </div>
</div>

<!-- Bootstrap JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- boardinsert.js 로드 -->
<script src="/js/boardinsert.js"></script>
</body>
</html>
