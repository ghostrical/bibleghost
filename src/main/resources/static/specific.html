<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Specific Page</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">specific.html 확인</h1>

    <!-- 입력 폼 -->
    <div class="row mb-3">
        <div class="col-md-3">
            <input type="text" id="input-title" class="form-control" placeholder="Title">
        </div>
        <div class="col-md-2">
            <input type="number" id="input-chapter" class="form-control" placeholder="Chapter">
        </div>
        <div class="col-md-2">
            <input type="number" id="input-verse" class="form-control" placeholder="Verse">
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary" id="btn-check">확인</button>
        </div>
    </div>


    <div class="mb-4">
        <textarea id="response-text" class="form-control" rows="5" readonly></textarea>
    </div>

    <!-- main 버튼 -->
    <div class="mt-4">
        <button class="btn btn-secondary" onclick="window.location.href='http://localhost:8080/content'">Main</button>
    </div>
</div>

<!-- Bootstrap JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- specific.js 로드 -->
<script src="/js/specific.js"></script>
</body>
</html>
