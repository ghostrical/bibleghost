<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Board Detail Page</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">boarddetail.html 확인</h1>


    <table class="table table-bordered table-striped">
        <tbody>
        <tr>
            <th>Board PK</th>
            <td id="boardPk"></td>
        </tr>
        <tr>
            <th>제목</th>
            <td id="title"></td>
        </tr>
        <tr>
            <th>작성자</th>
            <td id="writer"></td>
        </tr>
        <tr>
            <th>Source</th>
            <td id="source"></td>
        </tr>
        <tr>
            <th>생성일</th>
            <td id="createDt"></td>
        </tr>
        <tr>
            <th>수정일</th>
            <td id="updateDt"></td>
        </tr>
        </tbody>
    </table>


    <div class="mt-4">
        <button class="btn btn-secondary me-2" id="listBtn">목록</button>
        <button class="btn btn-primary me-2" id="updateBtn">수정</button>
        <button class="btn btn-danger me-2" id="deleteBtn">삭제</button>
    </div>
</div>

<!-- Bootstrap JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- boarddetail.js 로드 -->
<script src="/js/boarddetail.js"></script>
</body>
</html>
