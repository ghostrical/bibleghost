spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${DATABASE_SET}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        color-codes: true
        use_sql_comments: true
logging:
  level:
    org:
      springframework:
        orm:
          jpa: DEBUG
      hibernate:
        type: trace