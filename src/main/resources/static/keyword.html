<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>KeyWord Page</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">keyword.html 확인</h1>

    <!-- 입력 폼 -->
    <div class="row mb-3 g-2">
        <div class="col-md-4">
            <input type="text" id="input-keyword" class="form-control" placeholder="Keyword">
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary" id="btn-check">확인</button>
        </div>
    </div>

    <!-- 결과 테이블 -->
    <table class="table table-bordered table-striped mt-3">
        <thead class="table-dark">
        <tr>
            <th>성경코드</th>
            <th>성경전서</th>
            <th>장 번호</th>
            <th>장 이름</th>
            <th>절 번호</th>
            <th>절 내용</th>
            <th>Object</th>
        </tr>
        </thead>
        <tbody id="data-table">
        <!-- 서버에서 받아온 데이터가 여기에 동적으로 추가될 예정 -->
        </tbody>
    </table>

    <!-- main 버튼 -->
    <div class="mt-4">
        <button class="btn btn-secondary" onclick="window.location.href='http://localhost:8080/content'">Main</button>
    </div>
</div>

<!-- Bootstrap JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- keyword.js 로드 -->
<script src="/js/keyword.js"></script>
</body>
</html>
