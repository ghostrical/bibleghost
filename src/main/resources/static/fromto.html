<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>FromTo Page</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">fromto.html 확인</h1>

    <!-- 입력 폼 -->
    <div class="row mb-3 g-2">
        <div class="col-md-2">
            <input type="text" id="fromTitleNum" class="form-control" placeholder="From Title">
        </div>
        <div class="col-md-1">
            <input type="number" id="fromChapterNum" class="form-control" placeholder="From Chapter">
        </div>
        <div class="col-md-1">
            <input type="number" id="fromVerseNum" class="form-control" placeholder="From Verse">
        </div>
        <div class="col-md-2">
            <input type="text" id="toTitleNum" class="form-control" placeholder="To Title">
        </div>
        <div class="col-md-1">
            <input type="number" id="toChapterNum" class="form-control" placeholder="To Chapter">
        </div>
        <div class="col-md-1">
            <input type="number" id="toVerseNum" class="form-control" placeholder="To Verse">
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary" id="btn-check">확인</button>
        </div>
    </div>

    <!-- 결과 테이블 -->
    <table class="table table-bordered table-striped mt-3">
        <thead class="table-dark">
        <tr>
            <th>성경코드</th>
            <th>성경전서</th>
            <th>장 번호</th>
            <th>장 이름</th>
            <th>절 번호</th>
            <th>절 내용</th>
            <th>Object</th>
        </tr>
        </thead>
        <tbody id="data-table">

        </tbody>
    </table>

    <!-- main 버튼 -->
    <div class="mt-4">
        <button class="btn btn-secondary" onclick="window.location.href='http://localhost:8080/content'">Main</button>
    </div>
</div>

<!-- Bootstrap JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- fromto.js 로드 -->
<script src="/js/fromto.js"></script>
</body>
</html>
